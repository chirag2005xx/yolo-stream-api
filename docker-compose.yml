services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/data:ro"]
    environment:
      # video file in ./data, or an RTSP URL e.g. rtsp://user:pass@192.168.1.10:554/stream1
      SOURCE: /data/sample.mp4
      CONF: "0.35"
    # Linux webcam only: uncomment and set SOURCE: "0"
    # devices: ["/dev/video0:/dev/video0"]
